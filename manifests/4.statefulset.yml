apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: shankar
spec:
  serviceName: "mysql"
  replicas: 2
  selector:
    matchLabels:
      app: dbapp
  template:
    metadata:
      labels:
        app: dbapp
    spec:
      imagePullSecrets:
        - name: mysecret
      containers:
        - name: mycont
          image: shankarnarayana/clientapp:dbimage
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: www
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "200m"
              memory: "100Mi"
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
